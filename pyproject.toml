[project]
name = "doan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "aiofiles>=25.1.0",
    "av>=19.0.1",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scenedetect>=0.7.2",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.70.1",
    "transformers>=4.48.0,<5.0.0",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

