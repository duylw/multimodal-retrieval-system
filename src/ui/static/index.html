<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shot & Keyframe Debug Inspector - UIT Multimodal Retrieval</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Header Bar -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo-badge">UIT MULTIMODAL</div>
            <h1>Shot & Keyframe <span>Inspector</span></h1>
        </div>
        <div class="header-center">
            <div class="select-wrapper">
                <label for="videoSelect">Active Video:</label>
                <select id="videoSelect">
                    <option value="" disabled selected>Loading videos...</option>
                </select>
            </div>
        </div>
        <div class="header-right" id="videoStats">
            <div class="stat-badge">
                <span class="label">Duration</span>
                <span class="val" id="statDuration">--:--</span>
            </div>
            <div class="stat-badge">
                <span class="label">FPS</span>
                <span class="val" id="statFps">--</span>
            </div>
            <div class="stat-badge">
                <span class="label">Total Shots</span>
                <span class="val" id="statShots">--</span>
            </div>
            <div class="stat-badge">
                <span class="label">Keyframes</span>
                <span class="val" id="statKeyframes">--</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-main">
        <!-- Left Pane: Video Player & Timeline -->
        <section class="player-pane">
            <div class="player-card">
                <div class="video-container">
                    <video id="videoPlayer" controls preload="metadata" playsinline>
                        <p>Your browser does not support HTML5 video.</p>
                    </video>
                </div>

                <div class="player-meta">
                    <div class="time-display" id="timeDisplay">00:00.00 / 00:00.00</div>
                    <div class="current-shot-badge" id="currentShotBadge">Current: Shot #--</div>
                </div>

                <!-- Navigation Quick Controls -->
                <div class="quick-nav-bar">
                    <button class="nav-btn" id="btnPrevShot" title="Go to previous shot">
                        <span>&#9664;&#9664;</span> Prev Shot
                    </button>
                    <button class="nav-btn accent-btn" id="btnJumpCenter" title="Jump to center keyframe of current shot">
                        <span>&#9673;</span> Jump Center Keyframe
                    </button>
                    <button class="nav-btn" id="btnNextShot" title="Go to next shot">
                        Next Shot <span>&#9654;&#9654;</span>
                    </button>
                </div>

                <!-- Interactive Shot Timeline Section -->
                <div class="timeline-container">
                    <div class="timeline-header">
                        <span class="timeline-title">Shot Boundary Timeline (Click or Hover segment to inspect)</span>
                        <span class="timeline-time" id="timelineHoverTime">00:00.00</span>
                    </div>
                    <div class="timeline-track" id="shotTimeline">
                        <!-- Shot segments generated by JavaScript -->
                        <div class="timeline-cursor" id="timelineCursor"></div>
                    </div>
                    <div class="timeline-legend">
                        <div class="legend-item"><span class="legend-dot color-short"></span> Short (&lt;3s)</div>
                        <div class="legend-item"><span class="legend-dot color-med"></span> Medium (3-8s)</div>
                        <div class="legend-item"><span class="legend-dot color-long"></span> Long (&gt;8s)</div>
                        <div class="legend-item"><span class="legend-dot color-active"></span> Active Playing</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Pane: Shot & Keyframe List -->
        <section class="inspector-pane">
            <div class="inspector-controls">
                <div class="search-box">
                    <input type="text" id="shotSearch" placeholder="Search Shot ID (e.g. 15)...">
                </div>
                <div class="filter-box">
                    <select id="shotFilter">
                        <option value="all">All Shots</option>
                        <option value="short">Short (&lt;3s)</option>
                        <option value="medium">Medium (3-8s)</option>
                        <option value="long">Long (&gt;8s)</option>
                        <option value="multi-kf">Multiple Keyframes (&gt;1)</option>
                    </select>
                </div>
                <div class="auto-scroll-toggle">
                    <label>
                        <input type="checkbox" id="chkAutoScroll" checked>
                        <span>Auto-scroll with video</span>
                    </label>
                </div>
            </div>

            <!-- Scrollable Cards Container -->
            <div class="shot-list" id="shotList">
                <div class="loading-state" id="loadingState">Loading shot metadata and keyframes...</div>
            </div>
        </section>
    </main>

    <!-- Tooltip Element for Timeline -->
    <div class="timeline-tooltip" id="timelineTooltip"></div>

    <script src="app.js"></script>
</body>
</html>
