# System Configuration for Multimodal Video Retrieval
# Hardware Target: NVIDIA GeForce GTX 1650 (4GB VRAM), 16GB RAM, Windows OS

paths:
  raw_videos_dir: "data/raw_videos"
  keyframes_dir: "data/keyframes"
  indices_dir: "data/indices"
  metadata_db: "data/metadata.db"
  ground_truth_file: "data/ground_truth.json"
  models_dir: "models"

hardware:
  device: "cuda"
  max_vram_gb: 3.5
  cpu_threads: 4

shot_detection:
  method: "transnetv2" # options: "transnetv2", "pyscenedetect"
  threshold: 0.5
  min_shot_duration_sec: 1.0
  target_fps: 12.5 # downsample detection fps to 12.5fps for fast boundary detection
  high_fps_threshold: 15.0 # trigger frame-skipping when input fps exceeds this value

keyframe_selection:
  max_keyframes_per_shot: 3
  blur_threshold: 80.0
  min_brightness: 15.0
  duplicate_similarity_threshold: 0.95
  image_max_size: 720
  jpeg_quality: 85

visual_model:
  primary_model: "google/siglip2-base-patch16-256"
  batch_size: 16
  use_fp16: true

ocr_model:
  engine: "easyocr"
  language: "vi"
  use_gpu: true
  model_dir: "models/easyocr"
  min_confidence: 0.60
  edge_density_threshold: 0.08

retrieval:
  top_k_candidates_per_modality: 200
  sliding_window_size_sec: 5.0
  sliding_window_step_sec: 2.5
  rrf_k: 60
  weights:
    visual: 1.0
    ocr: 1.5
